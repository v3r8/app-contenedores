Solution: Fix Non-Interactive Build Process
The job is failing because the flet build apk command is prompting for user input when Flutter SDK needs to be installed, but the process is running in a non-interactive environment.

The error shows:

Code
EOFError: EOF when reading a line
Flutter SDK 3.44.8 is required. It will be installed now. Proceed? [y/n] (y):
Fix
Modify the Build APK Directly step in your workflow to pre-install the required Flutter SDK version and pass the --skip-version-check flag to bypass the prompt:

YAML
- name: Build APK Directly
  run: |
    flutter pub get
    flet build apk --verbose --skip-version-check
Alternatively, ensure Flutter is fully configured before the build by adding explicit version setup:

YAML
- name: Build APK Directly
  env:
    FLUTTER_SKIP_ANALYTICS: true
  run: |
    flutter doctor -v
    flutter pub get
    flet build apk --verbose --skip-version-check --no-version-check
Key changes:

Add --skip-version-check and --no-version-check flags to prevent interactive prompts
Run flutter pub get to fetch dependencies before building
Run flutter doctor -v to verify the Flutter environment is properly initialized
This will allow the build to proceed without waiting for user input in the non-interactive CI environment.
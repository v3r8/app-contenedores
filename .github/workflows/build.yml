Solution
The job is failing because the flet build command doesn't recognize the --app-name argument. The error shows:

Code
flet: error: unrecognized arguments: --app-name Appcontenedores
The flet CLI in version 0.86.5 doesn't support the --app-name flag. Instead, you need to configure the app name through a pubspec.yaml file or use a different approach.

Fix
Update your workflow file to remove the --app-name argument:

YAML
- name: Build APK with Flet
  run: |
    flet build apk
Alternatively, if you need to specify the app name, create a pubspec.yaml or flet.config.json configuration file in your repository root with the appropriate app name configuration, then build without the flag.


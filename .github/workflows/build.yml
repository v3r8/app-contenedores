name: Compilar APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Create project configuration if missing
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "Creating basic pubspec.yaml..."
            cat << 'EOF' > pubspec.yaml
          name: app_contenedores
          description: Aplicacion de contenedores
          publish_to: "none"
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            flet: any
          flutter:
            uses-material-design: true
          EOF
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-levels: '31'
          build-tools-version: '34.0.0'

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Build Flet APK
        run: |
          echo "y" | flet build apk --verbose

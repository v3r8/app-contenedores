Solución para el trabajo que falla
El trabajo falló durante el paso "Build Flet APK" con el error: "Error al compilar la app Flet". Los registros muestran "¡No se han encontrado problemas!", lo que indica que el comando de compilación Flet encontró un fallo interno sin mensajería de error clara.

Causa raíz
El problema es que el comando carece del parámetro --app-name, que es necesario para especificar el nombre de la aplicación para la compilación del APK. Sin esto, Flet fracasa en silencio.flet build apk

Arreglar
Actualiza el paso "Build Flet APK" en tu flujo de trabajo (líneas 74-81) para incluir el parámetro que falta:

YAML
- name: Build Flet APK
  run: |
    export ANDROID_SDK_ROOT=$ANDROID_HOME
    export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125
    
    flet build apk \
      --verbose \
      --org com.example \
      --app-name app_contenedores
Recomendaciones adicionales:

Añadir captura de salida de error: Modificar el comando de compilación para capturar mejor los errores internos de Flet:

YAML
flet build apk \
  --verbose \
  --org com.example \
  --app-name app_contenedores \
  2>&1
Verifica la compatibilidad de la versión Flet: Asegúrate de que tu versión sea compatible con la versión instalada de Flet. El flujo de trabajo crea una aplicación mínima, pero si existe una real, comprueba que sigue la API actual de Flet.main.pymain.py

Comprueba la compatibilidad del SDK de Android: Verifica que Flutter


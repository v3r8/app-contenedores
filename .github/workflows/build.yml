Problem
The job is failing because the flet build apk command is attempting to install Flutter SDK 3.44.8 but is expecting interactive input (y/n prompt). Since the workflow runs non-interactively, it encounters an EOFError: EOF when reading a line when trying to read from stdin.

The error occurs at this line:

Code
Flutter SDK 3.44.8 is required. It will be installed now. Proceed?   [y/n] (y):
Root Cause
The workflow sets up Flutter 3.24.0 (line 29), but Flet CLI is trying to use a different version (3.44.8) and prompting for confirmation in a non-interactive environment.

Solution
Add the --yes flag to the flet build apk command to automatically accept prompts without requiring user input:

Update line 83 in .github/workflows/build.yml:

YAML
      - name: Build APK Directly
        env:
          CI: true
        run: |
          cd $GITHUB_WORKSPACE
          flutter pub get
          flet build apk --verbose --yes
Alternatively, you can ensure Flet uses the same Flutter version by updating line 36 to install a specific Flet version that's compatible with Flutter 3.24.0, but the simpler fix is to add --yes to skip the interactive prompt.



name: Build Flet APK Direct

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Install dependencies & Flet CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
          pip install --upgrade pip
          pip install flet flet-cli

      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Configure Android SDK
        run: |
          flutter config --android-sdk $ANDROID_HOME
          yes | flutter doctor --android-licenses || true

      - name: Prepare Flet Project Structure
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            cat > pubspec.yaml << 'EOF'
          name: app_contenedores
          description: App Contenedores
          publish_to: 'none'
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
          dev_dependencies:
            flutter_test:
              sdk: flutter
          flutter:
            uses-material-design: true
          EOF
          fi

          if [ ! -f "main.py" ]; then
            echo "import flet as ft

          def main(page: ft.Page):
              page.add(ft.Text('App Contenedores'))

          if __name__ == '__main__':
              ft.app(target=main)" > main.py
          fi

      - name: Build APK Directly
        env:
          CI: true
        run: |
          cd $GITHUB_WORKSPACE
          flutter pub get
          flet build apk --verbose
name: Build Flet APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Install system dependencies & Flet CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
          python -m pip install --upgrade pip
          pip install flet flet-cli

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 31
          build-tools-version: '34.0.0'
          ndk-version: '25.2.9519653'
          cache: true
          install-system-images: false

      - name: Accept Android licenses
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install additional SDK packages
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-31" "build-tools;34.0.0" || true

      - name: Resolve Flutter dependencies
        run: |
          flutter pub get || true
          flutter doctor -v

      - name: Build APK via Flet CLI
        run: |
          echo "y" | flet build apk --verbose --release
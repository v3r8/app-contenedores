name: Compilar APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils build-essential

      - name: Create Flutter project
        run: |
          flutter create app_contenedores
          cd app_contenedores

      - name: Verify pubspec.yaml
        run: |
          cd app_contenedores
          if [ -f "pubspec.yaml" ]; then
            echo "¡El archivo pubspec.yaml existe!"
            cat pubspec.yaml
          else
            echo "Error: No se encuentra el archivo pubspec.yaml"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-levels: '34'
          build-tools-version: '34.0.0'
          ndk-version: '26.1.10909125'

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Verify Flutter setup
        run: flutter doctor -v

      - name: Build Flutter APK
        run: |
          cd app_contenedores
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-contenedores-apk
          path: app_contenedores/build/app/outputs/flutter-apk/*.apk

name: Build Flet APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install system dependencies & Flet CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
          python -m pip install --upgrade pip
          python -m pip install \
            "flet==0.86.5" \
            "flet-cli==0.86.5"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-31 build-tools;34.0.0 ndk;25.2.9519653'
          accept-android-sdk-licenses: true

      - name: Locate Flet project and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$(find . -name pyproject.toml \
            -not -path './.git/*' \
            -print -quit | xargs -r dirname)"

          test -n "$PROJECT_DIR" || {
            echo "Could not find pyproject.toml"
            exit 1
          }

          echo "Found Flet project root at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          python -m pip install .

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$(find . -name pyproject.toml \
            -not -path './.git/*' \
            -print -quit | xargs -r dirname)"
          cd "$PROJECT_DIR"
          
          flet build apk --verbose
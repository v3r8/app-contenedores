Problem
The flet build apk command is failing because:

Flutter SDK missing: The Flet CLI requires Flutter SDK 3.44.8 to be installed
Interactive prompt blocking: Flet is trying to prompt the user with [y/n] to confirm Flutter SDK installation, but in CI/CD environments there's no interactive input (EOF error)
Solution
Add the --no-ios flag and use the --flutter-version parameter, but more importantly, pre-install Flutter SDK before running the build command. Update your workflow:

YAML
- name: Set up Flutter
  run: |
    git clone https://github.com/flutter/flutter.git -b 3.44.8 ~/flutter
    echo "$HOME/flutter/bin" >> $GITHUB_PATH
    flutter doctor

- name: Build APK with Flet
  run: |
    flet build apk --no-interactive
Alternatively, if you want a simpler approach, install Flutter through actions/setup-flutter@v4:

YAML
- name: Set up Flutter
  uses: subosito/flutter-action@v2
  with:
    flutter-version: '3.44.8'

- name: Build APK with Flet
  run: |
    flet build apk
Key changes:

Add Flutter SDK setup before the build step (Flet requires it pre-installed)
Use --no-interactive flag to prevent interactive prompts in CI
Verify Flutter installation with flutter doctor
This ensures all dependencies are available before Flet attempts the build, preventing the EOF error and SDK initialization failure.


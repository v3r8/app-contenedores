name: Build Flet APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Install system dependencies & Flet CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
          python -m pip install --upgrade pip
          pip install flet flet-cli

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 31
          build-tools-version: '34.0.0'

      - name: Install Android SDK Tools & Components
        run: |
          sdkmanager --install "cmdline-tools;latest" --sdk_root=$ANDROID_SDK_ROOT || true
          sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-31" --sdk_root=$ANDROID_SDK_ROOT || true

      - name: Accept Android licenses
        run: |
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          yes | flutter doctor --android-licenses || true

      - name: Resolve Flutter dependencies
        run: |
          flutter pub get || true
          flutter doctor -v

      - name: Build APK via Flet CLI
        run: |
          echo "y" | flet build apk --verbose --release
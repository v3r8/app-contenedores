Solution
The job is failing because Flutter is not installed on the runner. The workflow attempts to use flutter commands in steps 26-33 (lines 28 and 32), but Flutter hasn't been set up yet.

Root Cause
The workflow is missing a step to install Flutter before trying to use it. The flet-dev/flet-build-action@v1 action on line 36 likely handles Flutter setup, but the earlier steps try to use Flutter commands before that action runs.

Fix
Add a Flutter setup step before the Accept Android licenses step. Update your workflow:

YAML
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses || true
The subosito/flutter-action@v2 action will:

Download and install Flutter
Add Flutter to your PATH
Make flutter commands available for subsequent steps
This should resolve the flutter: command not found error and allow your build to proceed.



name: Build Flet APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Flet App
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.10"
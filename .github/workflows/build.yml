name: Compilar APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils build-essential

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install flet

      - name: Create Flet project if missing
        run: |
          if [ ! -f main.py ]; then
            cat > main.py << 'EOF'
          import flet as ft

          def main(page: ft.Page):
              page.title = "App Contenedores"
              page.add(ft.Text("Hello, Flet!"))

          ft.app(target=main)
          EOF
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-levels: '34'
          build-tools-version: '34.0.0'
          ndk-version: '26.1.10909125'

      - name: Set up Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_PATH

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Verify Flutter setup
        run: flutter doctor -v

      - name: Build Flet APK
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125
          
          flet build apk \
            --verbose \
            --org=com.example \
            --app=app_contenedores

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-contenedores-apk
          path: |
            dist/*.apk
            build/**/outputs/flutter-apk/*.apk
